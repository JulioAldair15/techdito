<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TECHDITO - Iniciar Sesión</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="{{ url_for('static', filename='gota.ico') }}" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script defer src="{{ url_for('static', filename='js/script.js') }}"></script>

    
</head>
<body>
    <div class="login-container animate-in">
        <div class="login-header">
            <div class="brand-icon-wrapper">
                <i class="fas fa-network-wired"></i>
            </div>
            <div class="login-logo">
                TECH<span class="logo-accent">DITO</span>
            </div>
            <p class="login-subtitle">Panel Operativo</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                <div class="alert alert-{{ category }}">
                    <i class="fas fa-exclamation-circle"></i> {{ message }}
                </div>
                {% endfor %}
            {% endif %}  {% endwith %}

        <form action="{{ url_for('login') }}" method="POST">
            <div class="input-group">
                <label>Usuario</label>
                <div class="input-with-icon">
                    <i class="far fa-user"></i>
                    <input type="text" name="user" placeholder="Ej. arodas" required>
                </div>
            </div>

            <div class="input-group">
                <label>Contraseña</label>
                <div class="input-with-icon">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" name="password" placeholder="••••••••" required>
                    <span class="toggle-password" onclick="togglePassword()">
                        <i id="eye-icon" class="far fa-eye"></i>
                    </span>
                </div>
            </div>

            <button type="submit" class="btn-login">
                Iniciar Sesión <i class="fas fa-arrow-right"></i>
            </button>
        </form>

        <a href="#" class="forgot-link">¿Olvidaste tu contraseña?</a>
        <p class="version">v1.0.0 &copy; 2026</p>
    </div>
</body>
</html>
